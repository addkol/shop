server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        default_type text/plain;
        return 200 "OnlineShop TLS bootstrap in progress.\n";
    }

    location ~ /\. {
        deny all;
    }
}
