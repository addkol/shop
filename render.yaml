services:
  - type: web
    name: onlineshop
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn project.wsgi:application --bind 0.0.0.0:$PORT
    disk:
      name: onlineshop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DB_ENGINE
        value: django.db.backends.sqlite3
      - key: SQLITE_NAME
        value: /var/data/db.sqlite3
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SERVE_MEDIA_FILES
        value: "True"
      - key: SITE_URL
        value: https://onlineshop.onrender.com
      - key: USE_X_FORWARDED_PROTO
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: SMS_PROVIDER
        value: console
      - key: FINIK_USE_STUB
        value: "True"
