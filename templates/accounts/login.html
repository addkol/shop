{% extends "base.html" %}

{% block title %}Вход | Элит Маркет{% endblock %}

{% block content %}
<div class="auth-panel mx-auto">
  <h1 class="h3 mb-3">Вход клиента</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button class="btn btn-dark w-100" type="submit">{% if fixed_otp_enabled %}Получить подтверждение{% else %}Отправить Код SMS{% endif %}</button>
  </form>
  <div class="d-flex justify-content-between gap-3 mt-3 small">
    <a href="{% url 'accounts:register' %}">Создать аккаунт клиента</a>
    <a href="{% url 'admin:login' %}">Вход администратора</a>
  </div>
</div>
{% endblock %}
