{% if page.has_other_pages %}<nav class="pagination" aria-label="Страницы">
{% if page.has_previous %}<a class="button secondary" href="?{{ querystring }}&page={{ page.previous_page_number }}">← Назад</a>{% endif %}
<span>Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>
{% if page.has_next %}<a class="button secondary" href="?{{ querystring }}&page={{ page.next_page_number }}">Далее →</a>{% endif %}
</nav>{% endif %}
